<!DOCTYPE html>
<html lang="id" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B75BB" />
    <meta name="description" content="Monitoring permohonan, progres pekerjaan, dan buku kas Loket PLN ULP Agats" />
    <title>Loket PLN ULP Agats</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body class="min-h-[100dvh] bg-surface-light text-slate-700 dark:bg-surface-dark dark:text-slate-200 antialiased">

    <!-- ===== LOGIN ===== -->
    <div id="login-screen"
        class="fixed inset-0 z-[999] flex items-center justify-center overflow-y-auto bg-gradient-to-br from-pln-600 via-pln-700 to-pln-950 p-4">
        <div class="w-full max-w-sm rounded-2xl bg-white p-7 shadow-pop dark:bg-slate-800">
            <div class="mb-6 flex flex-col items-center text-center">
                <div class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-pln-500 text-2xl text-white shadow-lg shadow-pln-500/40">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h1 class="text-xl font-extrabold text-slate-900 dark:text-white">Loket PLN ULP Agats</h1>
                <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Sistem monitoring permohonan &amp; kas</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="mb-1 block text-xs font-semibold text-slate-600 dark:text-slate-300">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input id="login-username" type="text" autocomplete="username" required
                            class="input pl-10" placeholder="Masukkan username" />
                    </div>
                </div>
                <div>
                    <label class="mb-1 block text-xs font-semibold text-slate-600 dark:text-slate-300">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input id="login-password" type="password" autocomplete="current-password" required
                            class="input pl-10" placeholder="Masukkan password" />
                    </div>
                </div>
                <p id="login-error"
                    class="hidden rounded-lg border border-red-200 bg-red-50 p-2.5 text-center text-xs font-medium text-red-600 dark:border-red-900/50 dark:bg-red-950/40 dark:text-red-400">
                    Username atau password salah.
                </p>
                <button type="submit" class="btn btn-primary w-full">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- ===== APP SHELL ===== -->
    <div id="app" class="hidden">

        <!-- Sidebar (desktop) -->
        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-50 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-300 dark:border-slate-800 dark:bg-slate-900 md:static md:translate-x-0">
            <div class="flex h-16 items-center gap-3 border-b border-slate-100 px-5 dark:border-slate-800">
                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-pln-500 text-white shadow-sm shadow-pln-500/40">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="leading-tight">
                    <p class="text-sm font-extrabold text-slate-900 dark:text-white">Loket PLN</p>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400">ULP Agats</p>
                </div>
                <button data-close-sidebar class="ml-auto text-slate-400 md:hidden"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <nav class="flex-1 space-y-1 p-3" data-nav></nav>
            <div class="border-t border-slate-100 p-3 dark:border-slate-800">
                <div class="mb-2 flex items-center gap-3 rounded-xl bg-slate-50 p-2.5 dark:bg-slate-800/60">
                    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-pln-100 text-sm font-bold text-pln-600 dark:bg-pln-900/50 dark:text-pln-300">AL</div>
                    <div class="min-w-0 flex-1">
                        <p class="truncate text-xs font-semibold text-slate-900 dark:text-white">Admin Loket</p>
                        <p class="flex items-center gap-1 text-[11px] text-leaf-600"><span class="h-1.5 w-1.5 rounded-full bg-leaf-500"></span>Online</p>
                    </div>
                </div>
                <button data-toggle-theme class="btn btn-ghost w-full">
                    <i class="fa-solid fa-moon" data-theme-icon></i> <span data-theme-label>Mode Gelap</span>
                </button>
                <button data-logout class="btn btn-danger-ghost mt-2 w-full">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </aside>

        <div id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-slate-900/50 backdrop-blur-sm md:hidden"></div>

        <!-- Main -->
        <div class="flex min-w-0 flex-1 flex-col md:h-[100dvh]">
            <!-- Topbar -->
            <header
                class="sticky top-0 z-30 flex h-14 shrink-0 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
                <button data-open-sidebar class="text-slate-500 dark:text-slate-300 md:hidden">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <h1 data-page-title class="text-sm font-bold text-slate-900 dark:text-white md:text-base">Dashboard</h1>
                <div class="ml-auto flex items-center gap-1">
                    <button data-toggle-theme class="grid h-9 w-9 place-items-center rounded-lg text-slate-500 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 md:hidden">
                        <i class="fa-solid fa-moon" data-theme-icon></i>
                    </button>
                    <button data-page-action class="hidden"></button>
                </div>
            </header>

            <!-- Scroll area -->
            <main class="flex-1 overflow-y-auto px-4 pb-28 pt-4 md:px-6 md:pb-8 md:pt-6"
                style="padding-bottom: calc(7rem + env(safe-area-inset-bottom));">
                <section id="view-dashboard" data-view></section>
                <section id="view-permohonan" data-view hidden></section>
                <section id="view-kas" data-view hidden></section>
                <section id="view-harga" data-view hidden></section>
            </main>
        </div>
    </div>

    <!-- Bottom nav (mobile) -->
    <nav id="bottom-nav"
        class="fixed inset-x-0 bottom-0 z-40 hidden border-t border-slate-200 bg-white/95 backdrop-blur dark:border-slate-800 dark:bg-slate-900/95 md:!hidden"
        style="padding-bottom: env(safe-area-inset-bottom);" data-bottom-nav></nav>

    <!-- Hosts -->
    <div id="modal-host"></div>
    <div id="toast-host"
        class="pointer-events-none fixed inset-x-0 bottom-24 z-[120] flex flex-col items-center gap-2 px-4 md:bottom-6 md:left-auto md:right-6 md:items-end"></div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
